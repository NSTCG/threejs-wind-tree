<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Three.js Wind Tree — Customisable</title>
<style>
  :root{ --panel:#10151aee; --line:#2a3440; --txt:#dfe8f2; --dim:#8fa1b3; --acc:#6fd3ff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b0e12;
    font-family:'Segoe UI',system-ui,sans-serif; color:var(--txt); }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  #panel{
    position:fixed; top:14px; left:14px; width:288px; max-height:calc(100vh - 28px);
    overflow-y:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; backdrop-filter:blur(10px); box-shadow:0 12px 40px #0009;
    transition:transform .35s ease, opacity .35s ease; z-index:10;
  }
  #panel.hidden{ transform:translateX(-115%); opacity:0; pointer-events:none; }
  #panel h1{ font-size:15px; margin:0; padding:12px 14px 10px; letter-spacing:.4px;
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  #panel h1 small{ color:var(--dim); font-weight:400; font-size:11px; }
  .sec{ padding:10px 14px 4px; border-bottom:1px solid var(--line); }
  .sec:last-child{ border-bottom:none; padding-bottom:12px; }
  .sec h2{ font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px;
    color:var(--acc); margin:2px 0 8px; font-weight:600; }
  .row{ display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label{ flex:0 0 108px; font-size:12px; color:var(--dim); }
  .row output{ font-size:11px; color:var(--txt); min-width:34px; text-align:right; font-variant-numeric:tabular-nums;}
  input[type=range]{ flex:1; accent-color:var(--acc); height:4px; }
  select, button{
    background:#1a222c; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; font-size:12px; padding:5px 8px; cursor:pointer;
  }
  select{ flex:1; }
  button:hover, select:hover{ border-color:var(--acc); }
  .btnrow{ display:flex; gap:6px; margin-top:8px; }
  .btnrow button{ flex:1; }
  input[type=color]{ width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .toggle{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin:7px 0; cursor:pointer;}
  .toggle input{ accent-color:var(--acc); }

  #showBtn{
    position:fixed; top:14px; left:14px; z-index:9; width:38px; height:38px;
    border-radius:10px; background:var(--panel); border:1px solid var(--line);
    color:var(--txt); font-size:17px; cursor:pointer; display:none;
  }
  #showBtn.show{ display:block; }

  #hud{
    position:fixed; right:14px; bottom:12px; z-index:10; text-align:right;
    color:var(--dim); font-size:11.5px; line-height:1.6; pointer-events:none;
    text-shadow:0 1px 3px #000c;
  }
  #hud b{ color:var(--txt); font-weight:600; }
  #fps{ position:fixed; left:14px; bottom:12px; z-index:10; font-size:11.5px;
    color:var(--dim); text-shadow:0 1px 3px #000c; font-variant-numeric:tabular-nums;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<button id="showBtn" title="Show panel">☰</button>

<div id="panel">
  <h1>🌳 Wind Tree <small id="seedTag"></small></h1>

  <div class="sec">
    <h2>Tree</h2>
    <div class="row"><label>Type</label>
      <select id="s_type">
        <option value="oak">Oak (round)</option>
        <option value="pine">Pine (cone)</option>
        <option value="birch">Birch (slender)</option>
      </select>
    </div>
    <div class="row"><label>Height <output id="o_height"></output></label><input type="range" id="r_height" min="1.5" max="8" step="0.1"></div>
    <div class="row"><label>Trunk thickness <output id="o_trunk"></output></label><input type="range" id="r_trunk" min="0.08" max="0.7" step="0.01"></div>
    <div class="row"><label>Branch levels <output id="o_levels"></output></label><input type="range" id="r_levels" min="1" max="5" step="1"></div>
    <div class="row"><label>Branches / level <output id="o_bpl"></output></label><input type="range" id="r_bpl" min="2" max="9" step="1"></div>
    <div class="row"><label>Foliage density <output id="o_fol"></output></label><input type="range" id="r_fol" min="0.1" max="1" step="0.05"></div>
    <div class="row"><label>Canopy spread <output id="o_spread"></output></label><input type="range" id="r_spread" min="0.4" max="2" step="0.05"></div>
  </div>

  <div class="sec">
    <h2>Wind</h2>
    <div class="row"><label>Strength <output id="o_wind"></output></label><input type="range" id="r_wind" min="0" max="3" step="0.05"></div>
    <div class="row"><label>Direction <output id="o_wdir"></output></label><input type="range" id="r_wdir" min="0" max="360" step="1"></div>
  </div>

  <div class="sec">
    <h2>Particles</h2>
    <div class="row"><label>Falling leaves <output id="o_leaves"></output></label><input type="range" id="r_leaves" min="0" max="400" step="10"></div>
    <div class="row"><label>Air motes <output id="o_motes"></output></label><input type="range" id="r_motes" min="0" max="300" step="10"></div>
    <div class="toggle"><input type="checkbox" id="c_spark"><label for="c_spark">Sun sparkles</label></div>
  </div>

  <div class="sec">
    <h2>Colours</h2>
    <div class="row"><label>Leaf A</label><input type="color" id="col_leaf1"></div>
    <div class="row"><label>Leaf B</label><input type="color" id="col_leaf2"></div>
  </div>

  <div class="sec">
    <h2>Scene</h2>
    <div class="row"><label>Time of day <output id="o_tod"></output></label><input type="range" id="r_tod" min="0" max="1" step="0.01"></div>
    <div class="toggle"><input type="checkbox" id="c_shadow"><label for="c_shadow">Shadows</label></div>
    <div class="toggle"><input type="checkbox" id="c_rotate"><label for="c_rotate">Auto orbit</label></div>
  </div>

  <div class="sec">
    <h2>Actions</h2>
    <div class="btnrow">
      <button id="b_seed">🎲 New seed</button>
      <button id="b_reset">↺ Reset</button>
    </div>
  </div>
</div>

<div id="hud"><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>H</b> hide panel</div>
<div id="fps"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================ CONFIG STATE ============================ */
const DEFAULTS = {
  type:'oak', height:3.4, trunk:0.28, levels:4, bpl:5,
  fol:0.7, spread:1.0,
  wind:1.0, wdir:40,
  leaves:160, motes:120, spark:false,
  leaf1:'#3f9b4f', leaf2:'#8fd14f',
  tod:0.35, shadow:true, rotate:false
};
let S = { ...DEFAULTS };
let seed = Math.floor(Math.random()*1e6);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let rand = mulberry32(seed);
function reseed(s){ seed=s; rand=mulberry32(seed); document.getElementById('seedTag').textContent='#'+seed; }

/* ======================= RENDERER / SCENE (fast) ====================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
let prCap = Math.min(window.devicePixelRatio||1, 2);
let pr = prCap;
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfd9e8, 0.035);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(4.6, 2.6, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 2; controls.maxDistance = 25;

/* lights */
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x3a4a3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(6, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.camera.left=-9; sun.shadow.camera.right=9;
sun.shadow.camera.top=9;  sun.shadow.camera.bottom=-9;
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

/* shared wind uniforms — one update drives every material */
const windU = {
  uTime:   { value:0 },
  uWindDir:{ value:new THREE.Vector3(1,0,0) },
  uWindAmp:{ value:1 },
  uTreeH:  { value:3 }
};

/* ground */
const groundMat = new THREE.MeshStandardMaterial({ color:0x4e7a45, roughness:1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(28, 48), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

/* grass tufts — one instanced draw call */
{
  const gGeo = new THREE.ConeGeometry(0.035, 0.22, 4);
  gGeo.translate(0, 0.11, 0);
  const gMat = new THREE.MeshStandardMaterial({ color:0x5d8f4a, roughness:1 });
  const N=260;
  const grass = new THREE.InstancedMesh(gGeo, gMat, N);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), p=new THREE.Vector3(), sc=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const r=Math.sqrt(rand())*7 + 0.6;
    const a=rand()*Math.PI*2;
    p.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    e.set(rand(-0.15,0.15), rand(0,6.28), rand(-0.15,0.15));
    q.setFromEuler(e); sc.set(1, rand(0.7,1.6), 1);
    m.compose(p,q,sc); grass.setMatrixAt(i,m);
  }
  scene.add(grass);
}

/* ============================ WIND SYSTEM ============================= */
const wind = {
  t:0, strength:1, dir:new THREE.Vector3(1,0,0), gustLevel:0.3,
  update(dt){
    this.t += dt;
    this.strength = S.wind;
    const a = THREE.MathUtils.degToRad(S.wdir);
    this.dir.set(Math.cos(a), 0, Math.sin(a));
    this.gustLevel = 0.5 + 0.5*Math.sin(this.t*0.6) * (0.6+0.4*Math.sin(this.t*1.7+2));
  },
  sample(x,y,z,out){
    const t=this.t, s=S.wind*(0.6+0.4*this.gustLevel);
    const g = Math.sin(t*1.4 + y*0.9 + x*0.35)*0.6 + Math.sin(t*2.7 + y*1.6)*0.4;
    out.set(this.dir.x*s*(1+g*0.5), Math.sin(t*3.3+x+z)*0.05*s, this.dir.z*s*(1+g*0.5));
    return out;
  }
};
/* ============ TREE — 1 wood mesh + 1 foliage InstancedMesh ============ */
let treeGroup=null, barkTex=null;
const UP = new THREE.Vector3(0,1,0);
const leafGeoShared = (()=>{
  // one "leaf" = two crossed curved planes -> reads as volumetric from every angle
  function quad(){
    const g=new THREE.PlaneGeometry(0.36,0.28,2,1);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++)
      p.setZ(i, Math.sin(p.getX(i)*5.5)*0.05 + Math.cos(p.getY(i)*7.0)*0.035);
    g.computeVertexNormals();
    return g;
  }
  const a=quad(), b=quad();
  b.rotateY(Math.PI/2);                 // cross at 90°
  const c=quad(); c.rotateY(Math.PI/4); // +45° for fuller coverage
  return mergeGeometries([a,b,c], false);
})();

function makeBarkTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#5a4632'; x.fillRect(0,0,256,256);
  for(let i=0;i<90;i++){
    const px=rand()*256, py=rand()*256, w=rand(1.5,5), h=rand(20,90);
    x.strokeStyle=`rgba(${30+rand()*40|0},${22+rand()*30|0},${14+rand()*20|0},${0.25+rand()*0.3})`;
    x.lineWidth=w;
    x.beginPath(); x.moveTo(px,py);
    x.bezierCurveTo(px+rand(-6,6),py+h*0.3, px+rand(-6,6),py+h*0.7, px+rand(-4,4),py+h);
    x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,3);
  return t;
}

function disposeTree(){
  if(!treeGroup) return;
  scene.remove(treeGroup);
  treeGroup.traverse(o=>{
    if(o.isMesh){
      if(o.geometry && o.geometry!==leafGeoShared) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  });
  treeGroup=null;
}

/* wind sway shared by wood + foliage. It is a CONTINUOUS function of world
   position only — vertices that share a point (branch↔trunk, leaf↔twig)
   always move identically, so nothing can ever detach. Base pinned via hgt,
   fine flutter comes from a smooth spatial phase (no per-branch randomness). */
const WIND_FN_GLSL = `
  vec3 windOffset(vec3 P){
    float hgt  = clamp(P.y / max(uTreeH, 0.001), 0.0, 1.0);
    float gAmp = uWindAmp * (0.04 + 0.24*hgt*hgt) * hgt;
    float G    = sin(uTime*1.4 + P.y*0.9 + P.x*0.35)*0.6
               + sin(uTime*2.7 + P.y*1.6 + P.z*0.5)*0.4;
    float ph   = dot(P, vec3(1.7, 2.3, 1.9));
    float fl   = sin(uTime*5.2 + ph)*0.10 + sin(uTime*7.9 + ph*2.3)*0.05;
    return uWindDir * (G + fl) * gAmp;
  }
`;

function buildTree(){
  disposeTree();
  treeGroup = new THREE.Group();
  const H = S.height;
  windU.uTreeH.value = H;

  barkTex = makeBarkTexture();
  const isPine=S.type==='pine', isBirch=S.type==='birch';
  const MAX_BRANCHES=300; let effBpl=S.bpl;
  while(true){
    let total=Math.max(3,effBpl+1);
    for(let l=1;l<S.levels;l++) total*=effBpl;
    if(total<=MAX_BRANCHES || effBpl<=2) break;
    effBpl--;
  }

  /* ---- skeleton: pure vector math, everything baked into one space ---- */
  const branches=[], tips=[];
  function addBranch(origin, dir, len, radius, level){
    branches.push({origin, dir, len, radius, level});
    if(level < S.levels){
      const tip = origin.clone().addScaledVector(dir, len);
      for(let i=0;i<effBpl;i++){
        const a=(i/effBpl)*Math.PI*2 + level*0.7 + rand(-0.25,0.25);
        let tilt = isPine? rand(0.35,0.6) : isBirch? rand(0.9,1.4) : rand(0.5,1.1);
        const nd=new THREE.Vector3(
          Math.cos(a)*Math.sin(tilt),
          Math.cos(tilt)*(isBirch?-0.25:0.85),
          Math.sin(a)*Math.sin(tilt)).normalize();
        addBranch(tip, nd, len*rand(0.62,0.78), radius*0.6, level+1);
      }
    } else {
      tips.push({ pos: origin.clone().addScaledVector(dir,len), level });
    }
  }
  // the trunk wobbles (see twist below) — this is its EXACT centreline x at height y,
  // so root branches attach to where the wood actually is, never in mid-air
  const trunkX = y => { const f=y/H; return Math.sin(f*5.2)*f*0.14 + Math.sin(f*11+2)*f*0.05; };
  const rootN=Math.max(3, effBpl+1);
  for(let i=0;i<rootN;i++){
    const a=(i/rootN)*Math.PI*2 + rand(-0.3,0.3);
    let tilt = isPine? rand(0.5,0.8) : isBirch? rand(1.0,1.5) : rand(0.7,1.2);
    const dir=new THREE.Vector3(Math.cos(a)*Math.sin(tilt), Math.cos(tilt), Math.sin(a)*Math.sin(tilt)).normalize();
    const y=H*rand(0.55,0.95);
    // origin sits ON the (twisted) centreline + tiny jitter, always deep inside the wood
    addBranch(new THREE.Vector3(trunkX(y)+rand(-0.02,0.02), y, rand(-0.02,0.02)), dir, H*rand(0.28,0.4), S.trunk*0.6, 0);
  }

  /* ---- merge trunk + every branch into ONE geometry ---- */
  const geos=[];
  {
    const tg=new THREE.CylinderGeometry(S.trunk*0.42, S.trunk, H, 10, 6, false);
    const p=tg.attributes.position;
    for(let i=0;i<p.count;i++){
      const y=p.getY(i)+H/2, f=y/H;
      p.setX(i, p.getX(i) + Math.sin(f*5.2)*f*0.14 + Math.sin(f*11+2)*f*0.05);
    }
    tg.computeVertexNormals();
    tg.translate(0, H/2, 0);            // lift trunk so it spans y=0..H (was centred at origin)
    geos.push(tg);
  }
  for(const b of branches){
    // extend non-root branches slightly back INTO the parent so the solids
    // overlap in volume (cylinders meeting at a point leave a sky-gap wedge)
    const ov = b.level>0 ? b.radius*0.6 : 0;
    const g=new THREE.CylinderGeometry(b.radius*0.55, b.radius, b.len+ov, 7, 1);
    g.translate(0, (b.len+ov)/2 - ov, 0);   // spans -ov .. len
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, b.dir.clone().normalize()));
    g.translate(b.origin.x, b.origin.y, b.origin.z);
    geos.push(g);
    // joint knob at the branch base: guarantees solid overlap with the parent
    // for ANY tilt angle (its plane cuts the knob, so half is inside each side)
    const jg=new THREE.SphereGeometry(b.radius*1.05, 7, 5);
    jg.translate(b.origin.x, b.origin.y, b.origin.z);
    geos.push(jg);
  }
  // central leader: hides the flat trunk top cap so it never looks cut
  {
    const o=new THREE.Vector3(trunkX(H*0.8),H*0.8,0),
          d=new THREE.Vector3(rand(-0.12,0.12),1,rand(-0.12,0.12)).normalize(),
          len=H*0.24;
    branches.push({origin:o, dir:d, len, radius:S.trunk*0.5, level:0});
    tips.push({pos:o.clone().addScaledVector(d,len), level:0});
    const g=new THREE.CylinderGeometry(S.trunk*0.28, S.trunk*0.5, len, 7, 1);
    g.translate(0, len/2, 0);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, d));
    g.translate(o.x, o.y, o.z);
    geos.push(g);
  }
  const woodGeo=mergeGeometries(geos, false);
  geos.forEach(g=>g.dispose());

  const woodMat=new THREE.MeshStandardMaterial({ map:barkTex, roughness:0.95 });
  woodMat.onBeforeCompile = shader=>{
    Object.assign(shader.uniforms, windU);
    shader.vertexShader =
      'uniform float uTime; uniform vec3 uWindDir; uniform float uWindAmp; uniform float uTreeH;\n'
      + WIND_FN_GLSL
      + shader.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\n transformed += windOffset(position);');
  };
  const woodMesh=new THREE.Mesh(woodGeo, woodMat);
  woodMesh.castShadow=true; woodMesh.receiveShadow=true; woodMesh.frustumCulled=false;
  treeGroup.add(woodMesh);

  /* ---- ALL foliage clusters in ONE InstancedMesh ---- */
  const perTip = ()=> Math.max(3, Math.round((isPine?9:14)*S.fol));
  let total=0; for(const t of tips) total+=perTip();
  const cA=new THREE.Color(S.leaf1), cB=new THREE.Color(S.leaf2), birchTint=new THREE.Color('#d9e8a0');

  const leafMat=new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.85, side:THREE.DoubleSide });
  leafMat.onBeforeCompile = shader=>{
    Object.assign(shader.uniforms, windU);
    // displace in INSTANCE space (== world, treeGroup is untransformed) so the
    // exact same field moves wood and foliage -> leaves stay glued to twigs
    shader.vertexShader =
      'uniform float uTime; uniform vec3 uWindDir; uniform float uWindAmp; uniform float uTreeH;\n'
      + WIND_FN_GLSL
      + shader.vertexShader.replace('#include <project_vertex>',
        '#ifdef USE_INSTANCING\n'
        +'  vec4 mvPosition = instanceMatrix * vec4( transformed, 1.0 );\n'
        +'  mvPosition.xyz += windOffset( mvPosition.xyz );\n'
        +'#else\n'
        +'  vec4 mvPosition = vec4( transformed, 1.0 );\n'
        +'#endif\n'
        +'  mvPosition = modelViewMatrix * mvPosition;\n'
        +'  gl_Position = projectionMatrix * mvPosition;');
  };

  const foliage=new THREE.InstancedMesh(leafGeoShared, leafMat, total);
  foliage.castShadow=true; foliage.frustumCulled=false;
  {
    const m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(),
          p=new THREE.Vector3(), sc=new THREE.Vector3(), col=new THREE.Color(), v=new THREE.Vector3();
    let k=0;
    for(const t of tips){
      const count=perTip();
      const spreadR=(isPine?0.5:0.85)*S.spread*(0.7+t.level*0.12);
      for(let i=0;i<count;i++){
        v.set(rand(-1,1), rand(-0.6,1), rand(-1,1)).normalize();
        p.copy(t.pos).addScaledVector(v, rand(0,spreadR));
        e.set(rand(0,6.28), rand(0,6.28), rand(0,6.28)); q.setFromEuler(e);
        sc.setScalar(isPine? rand(0.55,1.0) : rand(0.7,1.3));
        m.compose(p,q,sc); foliage.setMatrixAt(k,m);
        col.copy(cA).lerp(cB, Math.random());
        if(isBirch) col.lerp(birchTint, 0.25*Math.random());
        foliage.setColorAt(k,col); k++;
      }
    }
    foliage.instanceMatrix.needsUpdate=true;
    if(foliage.instanceColor) foliage.instanceColor.needsUpdate=true;
  }
  treeGroup.add(foliage);
  scene.add(treeGroup);
}
/* ===================== PARTICLES (CPU sim, tiny) ====================== */
const _w=new THREE.Vector3(), _tmpC=new THREE.Color();

function makeSprite(inner){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,2,32,32,30);
  g.addColorStop(0,inner); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

/* falling leaves */
const MAX_LEAV=400;
const leafData=[];
for(let i=0;i<MAX_LEAV;i++) leafData.push({alive:false,p:new THREE.Vector3(),vy:0,spin:0,ph:rand(0,6.28)});
function respawnLeaf(d){
  const r=Math.sqrt(rand())*S.spread*1.4+0.2, a=rand()*Math.PI*2;
  d.p.set(Math.cos(a)*r, S.height*rand(0.5,1.05), Math.sin(a)*r);
  d.vy=-rand(0.25,0.6); d.spin=rand(-3,3); d.ph=rand(0,6.28);
}
const leafGeo=new THREE.BufferGeometry();
leafGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_LEAV*3),3).setUsage(THREE.DynamicDrawUsage));
leafGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(MAX_LEAV*3),3).setUsage(THREE.DynamicDrawUsage));
const leafPts=new THREE.Points(leafGeo, new THREE.PointsMaterial({
  size:0.16, map:makeSprite('rgba(255,255,255,1)'), vertexColors:true,
  transparent:true, depthWrite:false }));
leafPts.frustumCulled=false; scene.add(leafPts);

let leafColCache=new Float32Array(MAX_LEAV*3), leafColDirty=true;
function refreshLeafColors(){
  const cA=new THREE.Color(S.leaf1), cB=new THREE.Color(S.leaf2);
  for(let i=0;i<MAX_LEAV;i++){
    _tmpC.copy(cA).lerp(cB,(i%5)/5);
    leafColCache[i*3]=_tmpC.r; leafColCache[i*3+1]=_tmpC.g; leafColCache[i*3+2]=_tmpC.b;
  }
  leafColDirty=true;
}
function updateLeaves(dt,t){
  const n=S.leaves|0;
  leafGeo.setDrawRange(0,n);
  const pos=leafGeo.attributes.position, col=leafGeo.attributes.color;
  if(leafColDirty){
    col.array.set(leafColCache); col.needsUpdate=true; leafColDirty=false;
  }
  for(let i=n;i<MAX_LEAV;i++) leafData[i].alive=false;
  for(let i=0;i<n;i++){
    const d=leafData[i];
    if(!d.alive){ respawnLeaf(d); d.alive=true; }
    wind.sample(d.p.x,d.p.y,d.p.z,_w);
    d.p.addScaledVector(_w, dt*1.6);
    d.p.y += d.vy*dt;
    d.p.x += Math.sin(t*2+d.ph)*dt*0.35;
    d.p.z += Math.cos(t*1.7+d.ph)*dt*0.35;
    if(d.p.y<0.02) respawnLeaf(d);
    pos.array[i*3]=d.p.x; pos.array[i*3+1]=d.p.y; pos.array[i*3+2]=d.p.z;
  }
  pos.needsUpdate=true;
}

/* air motes */
const MAX_MOTE=300;
const moteData=[];
for(let i=0;i<MAX_MOTE;i++){
  const r=Math.sqrt(rand())*4.5, a=rand()*Math.PI*2;
  moteData.push({p:new THREE.Vector3(Math.cos(a)*r, rand(0.1,5), Math.sin(a)*r), ph:rand(0,6.28)});
}
const moteGeo=new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_MOTE*3),3).setUsage(THREE.DynamicDrawUsage));
moteGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(MAX_MOTE*3),3).setUsage(THREE.DynamicDrawUsage));
const motePts=new THREE.Points(moteGeo, new THREE.PointsMaterial({
  size:0.05, map:makeSprite('rgba(255,255,255,1)'), vertexColors:true,
  transparent:true, opacity:0.8, depthWrite:false, blending:THREE.AdditiveBlending }));
motePts.frustumCulled=false; scene.add(motePts);
function updateMotes(dt,t){
  const n=S.motes|0;
  moteGeo.setDrawRange(0,n);
  const pos=moteGeo.attributes.position, col=moteGeo.attributes.color;
  for(let i=0;i<n;i++){
    const d=moteData[i];
    wind.sample(d.p.x,d.p.y,d.p.z,_w);
    d.p.addScaledVector(_w, dt*0.55);
    d.p.y += Math.sin(t*0.8+d.ph)*dt*0.12;
    if(d.p.y<0.05) d.p.y=0.05; if(d.p.y>5.5) d.p.y=5.5;
    const r=Math.hypot(d.p.x,d.p.z);
    if(r>5.5){ d.p.x*=5.5/r; d.p.z*=5.5/r; }
    pos.array[i*3]=d.p.x; pos.array[i*3+1]=d.p.y; pos.array[i*3+2]=d.p.z;
    const tw=0.35+0.65*(0.5+0.5*Math.sin(t*2.2+d.ph));
    col.array[i*3]=tw; col.array[i*3+1]=tw*0.97; col.array[i*3+2]=tw*0.85;
  }
  pos.needsUpdate=true; col.needsUpdate=true;
}

/* sun sparkles */
const SPARK_N=40;
const sparkGeo=new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARK_N*3),3).setUsage(THREE.DynamicDrawUsage));
const sparkPts=new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  size:0.12, map:makeSprite('rgba(255,240,200,1)'), color:0xfff6d8,
  transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending }));
sparkPts.frustumCulled=false; scene.add(sparkPts);
const sparkPh=new Float32Array(SPARK_N).map(()=>rand(0,6.28));
function updateSpark(dt,t){
  if(!S.spark){ sparkPts.material.opacity=0; return; }
  const pos=sparkGeo.attributes.position;
  for(let i=0;i<SPARK_N;i++){
    const a=sparkPh[i]*7 + t*0.15, r=S.spread*1.1*(0.4+0.6*Math.abs(Math.sin(sparkPh[i]*3)));
    pos.array[i*3]=Math.cos(a)*r;
    pos.array[i*3+1]=S.height*(0.45+0.5*Math.abs(Math.cos(sparkPh[i]*5)));
    pos.array[i*3+2]=Math.sin(a)*r;
  }
  pos.needsUpdate=true;
  sparkPts.material.opacity=0.5+0.5*Math.sin(t*3.1);
}

/* ============================ SKY / TIME ============================== */
const skyU={ top:{value:new THREE.Color()}, bot:{value:new THREE.Color()} };
{
  const mat=new THREE.ShaderMaterial({
    uniforms:skyU, side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 top; uniform vec3 bot; varying vec3 vP;
      void main(){ float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(bot,top,pow(h,1.2)),1.0); }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(60,24,16), mat));
}
function applySky(){
  const t=S.tod;
  const dayT=new THREE.Color(0x87c5f2), dayB=new THREE.Color(0xdceefb);
  const setT=new THREE.Color(0x2a3a6e), setB=new THREE.Color(0xff9e5e);
  const nightT=new THREE.Color(0x0a1024), nightB=new THREE.Color(0x1a2440);
  let top,bot,sunCol,sunI,hemiI;
  if(t<0.25){ const k=t/0.25; top=nightT.clone().lerp(setT,k); bot=nightB.clone().lerp(setB,k);
    sunCol=new THREE.Color(0xffb070); sunI=0.4+1.2*k; hemiI=0.3+0.5*k; }
  else if(t<0.45){ const k=(t-0.25)/0.2; top=setT.clone().lerp(dayT,k); bot=setB.clone().lerp(dayB,k);
    sunCol=new THREE.Color(0xffd9a0).lerp(new THREE.Color(0xfff2d8),k); sunI=1.6; hemiI=0.85; }
  else if(t<0.75){ top=dayT.clone(); bot=dayB.clone(); sunCol=new THREE.Color(0xfff2d8); sunI=1.6; hemiI=0.85; }
  else if(t<0.9){ const k=(t-0.75)/0.15; top=dayT.clone().lerp(setT,k); bot=dayB.clone().lerp(setB,k);
    sunCol=new THREE.Color(0xfff2d8).lerp(new THREE.Color(0xffb070),k); sunI=1.6-1.1*k; hemiI=0.85-0.4*k; }
  else { const k=(t-0.9)/0.1; top=setT.clone().lerp(nightT,k); bot=setB.clone().lerp(nightB,k);
    sunCol=new THREE.Color(0xffb070); sunI=0.5-0.2*k; hemiI=0.35-0.15*k; }
  skyU.top.value.copy(top); skyU.bot.value.copy(bot);
  scene.fog.color.copy(bot).lerp(top,0.4);
  groundMat.color.set(0x4e7a45).multiplyScalar(0.4+0.6*Math.min(1,sunI/1.6));
  sun.color.copy(sunCol); sun.intensity=sunI; hemi.intensity=hemiI;
  const az=THREE.MathUtils.lerp(-2.4,2.4,t), el=Math.sin(t*Math.PI)*1.1+0.15;
  sun.position.set(Math.cos(az)*Math.cos(el)*10, Math.sin(el)*10, Math.sin(az)*Math.cos(el)*10);
}

/* ================================ UI ================================= */
const $=id=>document.getElementById(id);
function bindRange(id,key,outId,fmt){
  const el=$(id), out=$(outId);
  const set=v=>{ S[key]=v; if(out) out.textContent=fmt?fmt(v):v; };
  el.addEventListener('input',()=>set(parseFloat(el.value)));
  set(S[key]); el.value=S[key];
  return set;
}
const r_height =bindRange('r_height','height','o_height');
const r_trunk  =bindRange('r_trunk','trunk','o_trunk',v=>v.toFixed(2));
const r_levels =bindRange('r_levels','levels','o_levels');
const r_bpl    =bindRange('r_bpl','bpl','o_bpl');
const r_fol    =bindRange('r_fol','fol','o_fol',v=>Math.round(v*100)+'%');
const r_spread =bindRange('r_spread','spread','o_spread',v=>v.toFixed(2));
const r_wind   =bindRange('r_wind','wind','o_wind',v=>v.toFixed(2));
const r_wdir   =bindRange('r_wdir','wdir','o_wdir',v=>Math.round(v)+'°');
const r_leaves =bindRange('r_leaves','leaves','o_leaves');
const r_motes  =bindRange('r_motes','motes','o_motes');
const r_tod    =bindRange('r_tod','tod','o_tod',v=>Math.round(v*100)+'%');

let rebuildTimer=null;
function scheduleRebuild(){ clearTimeout(rebuildTimer); rebuildTimer=setTimeout(buildTree,60); }
['r_height','r_trunk','r_levels','r_bpl','r_fol','r_spread'].forEach(id=>$(id).addEventListener('change',scheduleRebuild));

$('s_type').value=S.type;
$('s_type').addEventListener('input',e=>{ S.type=e.target.value; scheduleRebuild(); });
$('c_spark').checked=S.spark;
$('c_spark').addEventListener('change',e=>S.spark=e.target.checked);
$('c_shadow').checked=S.shadow;
$('c_shadow').addEventListener('change',e=>{ S.shadow=e.target.checked; renderer.shadowMap.enabled=S.shadow; scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); });
$('c_rotate').checked=S.rotate;
$('c_rotate').addEventListener('change',e=>{ S.rotate=e.target.checked; controls.autoRotate=S.rotate; controls.autoRotateSpeed=0.8; });

function refreshColors(){
  groundMat.color.set(0x4e7a45);
  applySky();
  refreshLeafColors();
  scheduleRebuild();
}
$('col_leaf1').value=S.leaf1;
$('col_leaf2').value=S.leaf2;
$('col_leaf1').addEventListener('input',e=>{ S.leaf1=e.target.value; refreshColors(); });
$('col_leaf2').addEventListener('input',e=>{ S.leaf2=e.target.value; refreshColors(); });

$('b_seed').addEventListener('click',()=>{ reseed(Math.floor(Math.random()*1e6)); buildTree(); });
$('b_reset').addEventListener('click',()=>{
  S={...DEFAULTS}; reseed(Math.floor(Math.random()*1e6)); syncAllUI(); buildTree(); applySky();
});

function syncAllUI(){
  r_height(S.height); r_trunk(S.trunk); r_levels(S.levels); r_bpl(S.bpl);
  r_fol(S.fol); r_spread(S.spread); r_wind(S.wind); r_wdir(S.wdir);
  r_leaves(S.leaves); r_motes(S.motes); r_tod(S.tod);
  $('s_type').value=S.type;
  $('c_spark').checked=S.spark; $('c_shadow').checked=S.shadow; $('c_rotate').checked=S.rotate;
  controls.autoRotate=S.rotate;
  renderer.shadowMap.enabled=S.shadow;
  $('col_leaf1').value=S.leaf1; $('col_leaf2').value=S.leaf2;
}

const panel=$('panel'), showBtn=$('showBtn');
function togglePanel(){ panel.classList.toggle('hidden'); showBtn.classList.toggle('show', panel.classList.contains('hidden')); }
showBtn.addEventListener('click',togglePanel);
addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H') togglePanel(); });

/* ============================ MAIN LOOP =============================== */
const clock=new THREE.Clock();
let frames=0, fpsT=0;
const fpsEl=$('fps');
/* adaptive resolution: step pixel ratio down if fps sags, recover when headroom */
let perfT=0, perfFrames=0, highStreak=0;

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(), 0.05), t=clock.elapsedTime;

  wind.update(dt);
  windU.uTime.value=t;
  windU.uWindDir.value.copy(wind.dir);
  windU.uWindAmp.value=S.wind*(0.6+0.4*wind.gustLevel);

  updateLeaves(dt,t);
  updateMotes(dt,t);
  updateSpark(dt,t);

  controls.update();
  renderer.render(scene,camera);

  frames++; fpsT+=dt; perfT+=dt; perfFrames++;
  if(fpsT>=0.5){ fpsEl.textContent=Math.round(frames/fpsT)+' fps'; frames=0; fpsT=0; }
  if(perfT>=0.75){
    const fps=perfFrames/perfT; perfT=0; perfFrames=0;
    if(fps<85 && pr>1){ pr=Math.max(1,pr-0.25); renderer.setPixelRatio(pr); highStreak=0; }
    else if(fps>140 && pr<prCap){ highStreak+=0.75; if(highStreak>=3){ pr=Math.min(prCap,pr+0.25); renderer.setPixelRatio(pr); highStreak=0; } }
    else highStreak=0;
  }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* init */
reseed(seed);
syncAllUI();
buildTree();
applySky();
refreshLeafColors();
loop();
